[project]
name = "simple-agent"
version = "0.1.0"
description = "A simple AI agent built with crewAI"
requires-python = ">=3.10,<3.13"
dependencies = [
    "crewai[tools]>=0.86.0,<1.0.0",
]

[project.scripts]
simple_agent = "simple_agent.main:run"

[build-system]
requires = ["setuptools>=73.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
